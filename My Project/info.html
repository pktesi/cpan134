<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Info and feed back</title>
    </head>
    <body>
        <h2>My contact info</h2>
        <p> you can contact me through instagram at <a href="https://www.instagram.com/pktesi" target="_blank">instagram</a></p>

        <h2>Feedback Form</h2>
    <p>I would like to hear your thoughts on what you think of my web page. Please fill out the form below.</p>

    <form action="#" method="post">
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

    
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

    
        <label for="rating">Rate our service:</label>
        <select id="rating" name="rating" required>
            <option value="" disabled selected>Select a rating</option>
            <option value="5">Excellent (5⭐)</option>
            <option value="4">Very Good (4⭐)</option>
            <option value="3">Good (3⭐)</option>
            <option value="2">Fair (2⭐)</option>
            <option value="1">Poor (1⭐)</option>
        </select>
        <br><br>

        
        <label for="message">Your Feedback:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your feedback here..." required></textarea>
        <br><br>

        
        <input type="submit" value="Submit Feedback">
    </form>
    
    <footer>
        <p>Created by Powell Tesi.</p>
    </footer>

</body>
</html>
